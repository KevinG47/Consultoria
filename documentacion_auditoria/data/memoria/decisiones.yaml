# =====================================================================
# BITÁCORA DE DECISIONES DE DISEÑO — registro de trazabilidad
# =====================================================================
# Requisito del docente: que quede explícito qué se decidió al inicio y qué se
# está usando ahora, porque las decisiones cambiaron sobre la marcha. Nada debe
# quedar "perdido en una conversación".
#
# Estados permitidos:
#   vigente                  -> es la decisión actualmente en uso
#   superada                 -> fue reemplazada (debe apuntar a quién la reemplaza)
#   propuesta                -> considerada, aún no adoptada
#   pendiente_implementacion -> adoptada pero todavía no implementada en el código
#
# Verificación automática (regla R15): ninguna decisión "superada" puede seguir
# reflejada en el código o en los documentos actuales. Si el código no coincide
# con la decisión vigente, R15 FALLA y nombra el archivo y el marcador.
#
# Campos de verificación por decisión (`implementacion`):
#   archivos        -> rutas del proyecto donde debería verse esa decisión
#   marcador_codigo -> texto que debe estar presente si está implementada
#   marcador_doc    -> texto que la delata en la documentación
#   excepto_si      -> (opcional) excepción temporal declarada y auditable
#
# Nota sobre fechas: no se registraron timestamps exactos durante las sesiones.
# `fecha` usa la fecha de la sesión en que se decidió y `secuencia` conserva el
# orden relativo real (1 = primera decisión).
# =====================================================================

decisiones:
  - id: D001
    fecha: "2026-09-15"
    secuencia: 1
    tema: "memoria_semantica"
    decision: "Usar RAG para la memoria semántica del corpus documental"
    justificacion: >
      El corpus (criterios + LITE + maestro) es texto libre que crece y necesita
      mantenerse consistente entre documentos; sin recuperación previa el agente
      repite o contradice lo ya escrito.
    alternativas_descartadas: ["no tener memoria (solo contexto de la conversación)"]
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/rag.py"]
      marcador_codigo: "MemoriaSemantica"
      marcador_doc: "memoria semántica"
    fuente: F001

  - id: D002
    fecha: "2026-09-15"
    secuencia: 2
    tema: "tecnica_recuperacion"
    decision: "Usar TF-IDF (no embeddings) para el RAG"
    justificacion: >
      Corpus pequeño (~24 documentos, 137 fragmentos) y homogéneo en vocabulario
      técnico; TF-IDF resuelve el problema sin dependencias externas ni costo, y
      es determinista y explicable.
    alternativas_descartadas: ["embeddings vía API", "embeddings locales"]
    estado: superada
    superada_por: D007
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/rag.py"]
      marcador_codigo: "TfidfVectorizer"
      marcador_doc: "TF-IDF"
    fuente: F004

  - id: D003
    fecha: "2026-09-15"
    secuencia: 3
    tema: "memoria_estructural"
    decision: "Usar un grafo en memoria (networkx), no un motor externo"
    justificacion: >
      Escala real del proyecto (255 nodos / 498 aristas); un motor como Neo4j o
      Memgraph exigiría infraestructura y operación desproporcionadas para este
      volumen, sin aportar consultas que el proyecto necesite.
    alternativas_descartadas: ["Neo4j", "Memgraph"]
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/grafo.py"]
      marcador_codigo: "networkx"
      marcador_doc: "networkx"
    fuente: F002

  - id: D004
    fecha: "2026-09-15"
    secuencia: 4
    tema: "herramienta_externa"
    decision: "Descartar Obsidian Vault del pipeline automatizado"
    justificacion: >
      No tiene API programática que el agente pueda consultar ni validar; su rol
      queda como navegación humana del equipo, fuera de la arquitectura del
      agente.
    alternativas_descartadas: ["integrar Obsidian Vault como capa de memoria"]
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/grafo.py"]
      marcador_codigo: "networkx"
      marcador_doc: "Obsidian"
    fuente: F004

  - id: D005
    fecha: "2026-09-15"
    secuencia: 5
    tema: "fuente_de_verdad"
    decision: >
      Extender el grafo con datos EN VIVO del repo auditado (clon real + git log),
      no solo con los YAML/CSV ya procesados
    justificacion: >
      Permite verificar que lo documentado coincide con el repositorio auditado
      real, y no con una copia que puede quedar desactualizada.
    alternativas_descartadas: ["usar solo los CSV de data/ ya procesados"]
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/grafo.py"]
      marcador_codigo: "git_log_real"
      marcador_doc: "git log"
    fuente: F001

  - id: D006
    fecha: "2026-09-15"
    secuencia: 6
    tema: "validacion"
    decision: >
      Conectar la validación como puerta antes de compilar (compilar.py aborta con
      exit 2 si hay reglas en FALLA)
    justificacion: >
      El requisito del docente es que el sistema esté funcionando, no solo
      descrito; una puerta real que aborta la compilación lo demuestra.
    alternativas_descartadas: ["dejar la validación como script que se corre aparte"]
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/src/compilar.py"]
      marcador_codigo: "_puerta_memoria"
      marcador_doc: "puerta"
    fuente: F003

  - id: D007
    fecha: "2026-09-15"
    secuencia: 7
    tema: "tecnica_recuperacion"
    decision: "Migrar el RAG de TF-IDF a embeddings vía API key"
    justificacion: >
      Decisión del docente: un "diccionario" (TF-IDF) es incómodo de mantener y
      transferir; el proyecto debe dejar reproducibilidad para futuros trabajos y
      otros equipos.
    alternativas_descartadas: ["mantener TF-IDF"]
    estado: pendiente_implementacion
    supersede: D002
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/rag.py"]
      marcador_codigo: "embedding"
      marcador_doc: "embeddings"
      # Mientras la migración no esté implementada, R15 reportará el desfase
      # (el código sigue usando TF-IDF, decisión D002 superada). Si el docente
      # prefiere no bloquear la compilación durante la transición, se puede
      # declarar una excepción temporal auditables descomentando el bloque:
      # excepto_si:
      #   motivo: "Migración planificada; requiere API key de embeddings"
      #   autorizado_por: "Decisión del docente (D007)"
      #   hasta: "2026-10-31"
    fuente: F004

  - id: D008
    fecha: "2026-10-01"
    secuencia: 8
    tema: "indexacion_corpus"
    decision: "Corregir el indexador de markdown (rag.py): no borrar filas de tabla, preservar `_` en identificadores"
    justificacion: >
      El borrado descartaba el 37 % del texto (329 filas) y degradaba
      identificadores, causando 5 preguntas irrespondibles en el banco de 20.
      Medido y verificado.
    alternativas_descartadas: ["dejar el bug documentado sin corregir", "solo arreglar tablas sin tocar `_`"]
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/rag.py"]
      marcador_codigo: "_RE_FILA_SEPARADORA"
      marcador_doc: "D008"
    evidencia: >
      Antes: 145 fragmentos / 105.167 palabras / cobertura del texto de validación
      63,0 % (158.184 de 251.117 car.); banco 3/20 en top-1, 11/20 en top-3,
      15/20 presentes en el corpus. Después de reindexar: 150 fragmentos /
      116.277 palabras / cobertura 94,0 % (235.949 car.); banco 7/20 en top-1,
      9/20 en top-3, 16/20 presentes. Riesgo de respuesta inventada (dato ausente
      del corpus con score >= 0,05): 5 -> 4. Verificado con
      documentacion_auditoria/scripts/banco_preguntas.py y `python -m memoria
      validar` (R13 sigue PASA). Efecto colateral medido: al alargarse los
      fragmentos y crecer el vocabulario (40.573 a 45.799 términos), la
      normalización TF-IDF se diluye y el rank promedio del dato existente sube
      de 3,4 a 8,9; es el argumento empírico para D007 (embeddings).
    fuente: F001

  - id: D009
    fecha: "2026-10-01"
    secuencia: 9
    tema: "trazabilidad_cifras"
    decision: "Cerrar ciclo del fix D008: actualizar cifras y agregar R17"
    justificacion: >
      El fix D008 cambió el corpus de 145/105 167 a 150/116 277, y ninguna regla
      detectaba la obsolescencia. R17 cierra ese hueco de trazabilidad.
    alternativas_descartadas:
      - "dejar las cifras obsoletas y confiar en la revisión manual"
      - "una regla que solo vigilara fragmentos y palabras (dejaría fuera reglas, nodos, aristas y decisiones)"
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/src/memoria/reglas.py"]
      marcador_codigo: "r17_cifras_en_documentos"
      marcador_doc: "R17"
    evidencia: >
      R17 vigila siete cifras del sistema (fragmentos, palabras, términos del
      vocabulario, nodos, aristas, reglas y decisiones) contra cinco documentos
      que las citan (06b_memoria_agente.tex, README, guía de defensa, el texto
      de §6.2 y el banco de preguntas). Primera ejecución, con la documentación
      todavía sin actualizar: FALLA con 26 citas obsoletas localizadas con
      archivo y línea (tres de ellas que la revisión manual no había
      encontrado). Tras actualizar las cifras: PASA. En el mismo ciclo se
      propagó el conteo de reglas 16 a 17 en los documentos y en el banco.
      Además vigila el recuento de estados (15 PASA · 1 FALLA · 1 ADVERTENCIA):
      si R15 pasa a PASA (por ejemplo al implementar D007), los cinco documentos
      quedan obsoletos y R17 FALLA nombrando cada cita obsoleta. Verificado por
      simulación: con R15 en PASA y los documentos sin actualizar, R17 reporta
      las seis citas del recuento; con los estados reales, PASA. Vigila además
      los estados de regla citados en el banco de preguntas (Q16 afirma
      "esperado: FALLA" para R15): si esa regla cambia de estado, R17 FALLA
      nombrando la pregunta y el estado real de la regla.
    fuente: F003

  - id: D010
    fecha: "2026-10-04"
    secuencia: 10
    tema: "cifras_age_100"
    decision: "Dejar la cifra '22 registros con edad > 100' en el anteproyecto y aclararla oralmente en la sustentación"
    justificacion: >
      Las dos cifras son correctas: 22 sobre el universo declarado de 77 237 filas,
      19 sobre el consolidado de 50 891. El error es de redacción (ambigüedad), no de
      dato. La corrección del .tex dispara reindexado del RAG y cascada de R17, con
      riesgo alto a horas de la entrega. Se documenta como deuda declarada.
    alternativas_descartadas: ["corregir el .tex antes de la entrega", "corregir también las Entregas 3/4/5"]
    estado: vigente
    implementacion:
      archivos: ["documentacion_auditoria/data/memoria/decisiones.yaml"]
      marcador_codigo: "D010"
      marcador_doc: "22 registros con edad"
    evidencia: >
      Medido antes de decidir. El artefacto del repositorio auditado
      evidencias/calidad_resumen.json registra n_atipicos_edad=19 sobre n_total=50891
      (0,037 %) y evidencias/calidad_atipicos_edad.csv lista exactamente 19 filas
      (edad mínima 119,0; máxima 956,25). El 22 viene del informe narrativo del mismo
      repositorio (docs/informe/informe_final.tex:268 y README, hallazgo 7), calculado
      sobre 77 237 filas declaradas; y una tercera ficha
      (docs/inventario_notebooks.md:107) dice 10. El anteproyecto
      (latex/anteproyecto/secciones/01_problema.tex:55) dice 22 sin aclarar el
      universo: la cifra no es falsa, es ambigua. Aclaración oral prevista para la
      sustentación: 19 en el consolidado, 22 en el universo declarado, 10 en una
      ficha del repositorio auditado (su contradicción interna es el hallazgo).
      Consecuencia medida al registrar esta decisión: R17 pasa a FALLA con UNA sola
      cita desactualizada -- latex/anteproyecto/secciones/06b_memoria_agente.tex:67
      cita "9 registradas" cuando la bitácora ya tiene 10 -- porque el §6.2 del
      anteproyecto no se edita por decisión expresa. El desfase queda declarado aquí
      y visible en cada ejecución de `python -m memoria validar`; R15 y R16 no
      reportan problema alguno por D010 (tema propio, sin duplicidad).
    fuente: F001
